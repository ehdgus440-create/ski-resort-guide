<title>전국 스키장 가이드 | 2026–27 개장일·슬로프·이벤트</title>
<meta name="description" content="전국 스키장 13곳의 2026–27 시즌 개장일, 중요 공지, 이벤트, 슬로프 운영 현황과 공식 확인 링크를 스키장별 카드로 확인하세요.">
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4f8;color:#12283d;font:16px/1.55 system-ui,sans-serif}
.hero{background:radial-gradient(ellipse at 90% 0%,#315d77,transparent 60%),linear-gradient(125deg,#10263d,#173954);color:white;padding:32px max(20px,calc((100vw - 1080px)/2)) 44px}.season{font-size:.9rem;color:#a9d8eb;font-weight:700;letter-spacing:.14em}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.15;margin:12px 0}.hero p{margin:0;color:#d8e8f3}
main{max-width:1120px;margin:auto;padding:24px 20px 48px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.filters label{display:grid;gap:5px;font-size:.9rem;font-weight:650}input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid #b9cbd8;border-radius:10px;background:white;color:inherit;padding:8px 12px}#count{margin:20px 0 10px;color:#4a6377;font-weight:650}
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;background:white;border:1px solid #d5e1ea;border-radius:16px;padding:17px;box-shadow:0 3px 10px #15354f09}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#4a6377;font-size:.89rem}.tag{border-radius:999px;padding:3px 9px;background:#edf0f3;color:#3f566a;font-weight:700}.tag[data-status="발표"]{background:#d9f3ed;color:#086250}.tag[data-status="예정"]{background:#e1effd;color:#215489}.tag[data-status="잠정"]{background:#fcf0d5;color:#704a07}h2{font-size:1.23rem;margin:10px 0 0}.date{font-size:1.24rem;margin:2px 0 8px;color:#134f76;font-weight:750}.perk{margin:0 0 14px;flex:1;color:#314b60}.open,.close{border:1px solid #b5cedf;background:#f0f7fb;color:#174c71;border-radius:9px;padding:8px 12px;font-weight:650;cursor:pointer;min-height:44px}.open:hover,.close:hover{background:#dfedf6}:focus-visible{outline:3px solid #2585b4;outline-offset:2px}
dialog{width:min(560px,calc(100% - 28px));max-height:85vh;border:0;border-radius:16px;padding:22px;color:inherit;box-shadow:0 20px 60px #0f273c66}dialog::backdrop{background:#10263db0}.details-head{display:flex;justify-content:space-between;gap:12px;align-items:start}dialog h2{font-size:1.45rem;margin:4px 0}dialog p{white-space:pre-line}dialog a{color:#15557f;text-underline-offset:4px}footer{font-size:.9rem;color:#496276;margin-top:25px}
@media(max-width:820px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){#cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}main{padding-inline:15px}}

.hero{position:relative;isolation:isolate;overflow:hidden;display:grid;align-content:center;min-height:290px}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 52%;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#081b2deb 0%,#0d233aaa 43%,#0c233728 100%);z-index:-1}
@media(max-width:530px){.hero{min-height:260px;align-content:end;padding-bottom:28px}.hero-photo{object-position:68% center}.hero::before{background:linear-gradient(0deg,#081b2df2 0%,#0d233a9c 52%,#0c23371a 100%)}}

.facts{display:grid;gap:0;margin:10px 0 16px;flex:1}.fact{border-top:1px solid #e1ebf2;padding:8px 0}.fact dt{font-size:.88rem;font-weight:750;color:#355970}.fact dd{margin:2px 0 0;font-size:.94rem}.fact dd.date{font-size:1.1rem}.live-link{display:block;color:#145781;text-underline-offset:4px;padding:7px 0 0;min-height:32px;font-weight:650}

.ticket-price,.ticket-note{display:block}.price-status{display:inline-block;margin:4px 0;color:#215489;font-weight:700}
.ticket-note{color:#465e72;margin-top:3px}.price-links{display:flex;gap:4px 14px;flex-wrap:wrap}.price-links a{color:#145781;text-underline-offset:4px;padding:5px 0}

body{background:#edf5fa}
#cards{gap:20px}
.card{padding:0;overflow:hidden;border:1px solid #c9dbe9;border-radius:19px;box-shadow:0 5px 18px #173d5a12}
.card-mast{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;min-height:124px;padding:14px 16px;color:#fff;background:#143653}
.card-photo{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:45% 32%}
.card:nth-child(3n+2) .card-photo{object-position:70% 45%}
.card:nth-child(3n+3) .card-photo{object-position:85% 68%}
.card-mast::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,#071f35e8,#11355075),linear-gradient(0deg,#081e36b8,transparent)}
.card-mast h2{margin:12px 0 0;line-height:1.3;font-size:1.3rem;color:#fff;overflow-wrap:anywhere}
.card-mast .meta{color:#f3f9ff;font-weight:650}
.card-mast .tag{flex-shrink:0}
.card > .facts{margin:0;padding:0 16px 12px}
.card > .facts .fact{padding:9px 0}
.card > .facts .fact:first-child{margin:0 -16px;padding:9px 16px;border-top:0;border-bottom:1px solid #d4e5ef;background:#e7f3fa}
.card > .facts .fact:nth-child(2){border-top:0}
.card > .facts .date{font-variant-numeric:tabular-nums}
.card .open{margin:0 16px 16px;background:#15496c;border-color:#15496c;color:white}
.card .open:hover{background:#0e3856}
@media(max-width:530px){#cards{gap:15px}.card-mast{min-height:110px}}
</style>

function element(tag, className, value) {
  const node = document.createElement(tag);

}
function priceLink(label, url) {
  const link = element("a","",label);

  return link;
}
function resortFacts(resort, { showPrice = false } = {}) {
  const facts = element("dl","facts","");
  const rows = [
    ["개장일",resort.date],
    ["중요 공지",resort.notice],
    ["이벤트",resort.event],
    ["개장 후 슬로프 현황",resort.slope]
  ];
  for (const [label,value] of rows) {
    const row = element("div","fact","");
    row.append(element("dt","",label),element("dd",label === "개장일" ? "date" : "",value));
    facts.append(row);
  }
  const link = element("a","live-link",resort.liveLabel);
  link.href = resort.liveUrl;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  facts.lastElementChild.lastElementChild.append(link);
  if (showPrice) {
    const row = element("div","fact ticket","");
    const ticket = element("dd","","");
    const links = element("div","price-links","");
    links.append(priceLink("가격 출처",resort.priceSource));
    if (resort.priceOfficial !== resort.priceSource) {
      links.append(priceLink("공식 이용 안내",resort.priceOfficial));
    }
    ticket.append(element("small","price-status",resort.priceStatus),element("strong","ticket-price",resort.price),
      element("span","ticket-note",resort.priceNote),links);

  }
  return facts;
}

    const card = element("article","card","");
    const meta = element("div","meta",resort.area);
    const tag = element("span","tag",resort.status);
    tag.dataset.status = resort.status;
    meta.append(tag);
    const button = element("button","open","상세 보기");
    button.type = "button";
    button.setAttribute("aria-label",resort.name + " 상세 보기");
    button.addEventListener("click",() => showDetails(resort,button));
    const mast = element("div","card-mast","");
    const photo = winterPhoto.cloneNode();
    photo.className = "card-photo";
    photo.loading = "lazy";
    photo.decoding = "async";
    mast.append(photo,meta,element("h2","",resort.name));
    card.append(mast,resortFacts(resort),button);
    return card;
  }));
}
search.addEventListener("input",render);
region.addEventListener("change",render);
status.addEventListener("change",render);
details.addEventListener("close",() => lastButton?.focus());
render();
</script>
</body>
</html>
